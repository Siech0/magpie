[package]
name = "magpie-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared HTTP glue for magpie."

[dependencies]
magpie-db = { version = "0.1.0", path = "../db" }
garde = { version = "0.23.0", features = ["derive"] }
axum = { version = "0.8.9", features = ["macros"] }
clap = "4.6.7"
hyper = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = "1.53.3"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["request-id", "timeout", "trace"] }
tracing = "0.1.44"
anyhow = "1.0.104"

[lints]
workspace = true
