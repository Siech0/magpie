[package]
name = "magpie-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Database access and migrations for magpie."

[dependencies]
garde = { version = "0.23.0", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["tls-rustls", "runtime-tokio", "postgres", "sqlite", "uuid", "time", "json", "migrate"] }
magpie-core = { version = "0.1.0", path = "../core" }

[dev-dependencies]
toml = "1.1.8"

[lints]
workspace = true
