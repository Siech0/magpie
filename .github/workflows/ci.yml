name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      # Clippy and deny run in their own jobs.
      SKIP: cargo-clippy,cargo-deny
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: magpie
          POSTGRES_PASSWORD: magpie
          POSTGRES_DB: magpie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magpie"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      MAGPIE_TEST_POSTGRES_URL: postgres://magpie:magpie@localhost:5432/magpie
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Migrate a fresh SQLite database
        run: cargo run -p magpie-server -- --db-backend sqlite --sqlite-path "$RUNNER_TEMP/magpie.db" migrate
      - name: Migrate a fresh Postgres database
        env:
          MAGPIE_DB__BACKEND__TYPE: postgres
          MAGPIE_DB__BACKEND__PASSWORD: env:PGPASSWORD
          MAGPIE_DB__BACKEND__SSL_MODE: disable
          PGPASSWORD: magpie
        run: cargo run -p magpie-server -- migrate
      - run: cargo nextest run --workspace --all-features --no-tests=pass
      - run: cargo test --workspace --doc
      - run: cargo doc --workspace --no-deps --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  udeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps
      - run: cargo udeps --workspace --all-targets --all-features

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - run: git diff origin/${{ github.base_ref }}.. > pr.diff
      - run: cargo mutants --workspace --test-tool nextest --in-diff pr.diff --no-shuffle
